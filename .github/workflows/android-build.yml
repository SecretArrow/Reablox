name: Android Build & E2E

# Pipeline rilis: quality gate -> build APK signed -> verifikasi signature ->
# E2E di emulator Android -> (push main) upsert pre-release dev-build.
# Rilis stabil (tag v*) diterbitkan oleh release.yml setelah workflow ini sukses.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "prompts/**"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Buat GitHub Release (APK) setelah build+E2E sukses"
        type: boolean
        default: false
      e2e_mode:
        description: "Mode E2E emulator: SMOKE | STANDARD | DEEP"
        type: string
        default: SMOKE

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  quality-gate:
    name: Quality gate (lint + unit + gameplay tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install gdtoolkit
        run: pip install -r requirements-ci.txt

      - name: gdformat --check
        run: |
          if ! gdformat --check scripts/ tools/ scenes/; then
            echo "::error::Format kode tidak sesuai gdformat."
            exit 1
          fi

      - name: gdlint
        run: |
          if ! gdlint scripts/ tools/; then
            echo "::error::gdlint menemukan pelanggaran style."
            exit 1
          fi

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-editor-v2

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}"
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp/godotbin
          sudo mv /tmp/godotbin/Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Import project assets
        run: godot --headless --import --path "$PWD"

      - name: Run all test scenes
        run: |
          set -o pipefail
          FAIL=0
          mkdir -p testlogs
          shopt -s nullglob
          for tscn in tools/tests/test_*.tscn tools/test_mm.tscn tools/test_budget.tscn; do
            name="$(basename "$tscn" .tscn)"
            echo "" && echo "================ $name ================"
            timeout 300 godot --headless "res://$tscn" 2>&1 | tee "testlogs/${name}.log" || true
            if ! grep -q "ALL_TESTS_PASS" "testlogs/${name}.log"; then
              echo "::error::Test scene $tscn gagal"
              FAIL=1
            fi
            if grep -qE "SCRIPT ERROR|Parse Error" "testlogs/${name}.log"; then
              echo "::error::Error skrip terdeteksi di $tscn"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Upload test logs (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-test-logs
          path: testlogs/
          retention-days: 7

  build:
    name: Export & sign APK (release keystore)
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signing_mode: ${{ steps.signmode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" "platform-tools" > /dev/null

      - name: Cache Godot editor & templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Cache Gradle (AGP & dependensi)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-${{ env.GODOT_VERSION }}-android34

      - name: Install Godot + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}"
          curl -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          curl -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          unzip -o /tmp/godot.zip -d /tmp/godotbin
          sudo mv /tmp/godotbin/Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${V}.stable
          unzip -o /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${V}.stable/

      - name: Resolve signing mode
        id: signmode
        env:
          HAVE_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing: RELEASE keystore (GitHub Secrets)"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Rilis stabil (tag) WAJIB memakai release keystore. Set secrets: SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          else
            echo "::warning::Secrets signing tidak ditemukan — fallback DEBUG keystore (hanya untuk dev-build, bukan rilis stabil)."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release keystore (dari Secrets)
        if: steps.signmode.outputs.mode == 'release'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # Decode keystore hanya di runner sementara (tidak pernah masuk repo/log)
          KS="$RUNNER_TEMP/reablox-release.keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KS"
          # Patch export_presets.cfg: keystore/release untuk signing APK
          sed -i \
            -e "s|keystore/release=\"\"|keystore/release=\"$KS\"|" \
            -e "s|keystore/release_user=\"\"|keystore/release_user=\"${KEY_ALIAS}\"|" \
            -e "s|keystore/release_password=\"\"|keystore/release_password=\"${KEY_PASSWORD}\"|" \
            export_presets.cfg
          # Sanity: keytool bisa membaca keystore & alias (password TIDAK dicetak)
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Release keystore OK (alias: ${KEY_ALIAS})"

      - name: Generate debug keystore (fallback)
        if: steps.signmode.outputs.mode == 'debug'
        run: |
          set -e
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          sed -i \
            -e "s|keystore/release=\"\"|keystore/release=\"$HOME/.android/debug.keystore\"|" \
            -e "s|keystore/release_user=\"\"|keystore/release_user=\"androiddebugkey\"|" \
            -e "s|keystore/release_password=\"\"|keystore/release_password=\"android\"|" \
            -e "s|keystore/debug=\"\"|keystore/debug=\"$HOME/.android/debug.keystore\"|" \
            -e "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|" \
            -e "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|" \
            export_presets.cfg

      - name: Versioning otomatis (versionCode monotonik)
        run: |
          set -e
          CODE="$GITHUB_RUN_NUMBER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.4.0-dev.${CODE}"
          fi
          sed -i "s|version/code=[0-9]*|version/code=${CODE}|g; s|version/name=\"[^\"]*\"|version/name=\"${NAME}\"|g" export_presets.cfg
          echo "versionCode=$CODE versionName=$NAME"

      - name: Install Android build template (gradle)
        run: |
          set -e
          TPLDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p android/build
          unzip -o "$TPLDIR/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          ls android/build | head -6

      - name: Import project assets
        run: godot --headless --import --path "$PWD"

      - name: Smoke test headless (cek error skrip)
        run: |
          set -o pipefail
          timeout 120 godot --headless --quit-after 30 --path "$PWD" 2>&1 | tee smoke.log
          if grep -qE "SCRIPT ERROR|Parse Error" smoke.log; then
            echo "::error::Error skrip terdeteksi saat smoke test"
            exit 1
          fi

      - name: Export APK universal
        run: |
          set -e
          mkdir -p build
          godot --headless --export-release "Android" build/Reablox-universal.apk --path "$PWD" || {
            echo "::warning::Export gradle gagal, fallback ke preset prebuilt (Android-Quick)"
            godot --headless --export-release "Android-Quick" build/Reablox-universal.apk --path "$PWD"
          }
          ls -lh build

      - name: Export APK split per ABI
        run: |
          set -e
          godot --headless --export-release "Android-arm64"   build/Reablox-arm64-v8a.apk    --path "$PWD"
          godot --headless --export-release "Android-armv7"   build/Reablox-armeabi-v7a.apk  --path "$PWD"
          godot --headless --export-release "Android-x86_64"  build/Reablox-x86_64.apk       --path "$PWD"
          ls -lh build

      - name: Verifikasi signature APK (apksigner)
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          fail=0
          for f in build/Reablox-*.apk; do
            echo "--- $f ---"
            "$APKSIGNER" verify --print-certs "$f" | tee "certs_$(basename "$f").txt" || fail=1
            if grep -q "CN=Android Debug" "certs_$(basename "$f").txt"; then
              echo "::error::$f ditandatangani DEBUG keystore — tidak boleh untuk rilis"
              fail=1
            fi
          done
          exit $fail

      - name: Check APK sizes (max 300MB each)
        run: |
          fail=0
          for f in build/Reablox-*.apk; do
            SIZE=$(du -m "$f" | cut -f1)
            echo "APK: $(basename "$f") = ${SIZE} MB"
            if [ "$SIZE" -gt 300 ]; then echo "::error::$f melebihi 300MB"; fail=1; fi
          done
          exit $fail

      - name: Bersihkan file sensitif
        if: always()
        run: rm -f "$RUNNER_TEMP"/reablox-release.keystore 2>/dev/null || true

      - name: Upload APK artifacts (split per ABI + universal)
        uses: actions/upload-artifact@v4
        with:
          name: Reablox-Android
          path: |
            build/Reablox-universal.apk
            build/Reablox-arm64-v8a.apk
            build/Reablox-armeabi-v7a.apk
            build/Reablox-x86_64.apk
          retention-days: 14
          if-no-files-found: error

  screenshots:
    name: Pratinjau screenshot (render tanpa install)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pasang Xvfb + Mesa (render software)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
      - name: Pulihkan cache Godot 4.4.1
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-4.4.1-stable-linux
      - name: Unduh Godot 4.4.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/godot
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /opt/godot
          chmod +x /opt/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Render 5 pratinjau 1080p (menu, kota, build, obby, avatar)
        run: |
          mkdir -p shots
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 timeout 900 \
            /opt/godot/Godot_v4.4.1-stable_linux.x86_64 \
            --path . --resolution 1920x1080 \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --audio-driver Dummy -- --screenshot-demo --shot-dir="$PWD/shots"
          test "$(ls shots/*.png 2>/dev/null | wc -l)" -ge 5
      - name: Unggah artifact pratinjau
        uses: actions/upload-artifact@v4
        with:
          name: Reablox-Screenshots
          path: shots/*.png
          retention-days: 30
          if-no-files-found: error

  e2e-test:
    name: E2E APK di emulator (autonomous tester)
    needs: [build, screenshots]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/universal-apk-test.yml
    with:
      mode: ${{ (startsWith(github.ref, 'refs/tags/') && 'STANDARD') || (github.event.inputs.e2e_mode || 'SMOKE') }}
      apk_source: artifact
      apk_artifact_name: Reablox-Android
      attach_to_release: false
      autofix: false
    secrets: inherit

  dev-release:
    name: Dev pre-release (continuous)
    needs: [build, e2e-test]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.e2e-test.result == 'success'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.reltag.outputs.tag }}
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: Reablox-Android
          path: build
      - name: Upsert pre-release dev-build (split per ABI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          gh release create dev-build build/Reablox-*.apk --prerelease --title "Reablox Dev Build" --notes "Build otomatis dari commit $GITHUB_SHA (split per ABI, signed release keystore).\n\nPilih sesuai CPU HP:\n- arm64-v8a → HP modern (disarankan)\n- armeabi-v7a → HP lama\n- x86_64 → emulator/ChromeOS\n- universal → semua arsitektur\n\nInstall: unduh APK, izinkan install dari sumber tidak dikenal. 100% gratis, tanpa iklan, tanpa IAP."
      - name: Catat tag rilisan
        id: reltag
        run: echo "tag=dev-build" >> "$GITHUB_OUTPUT"
